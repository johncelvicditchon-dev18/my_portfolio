<body>
<a class="skip-link" href="#main">Skip to content</a>

<!-- ── Atmosphere ───────────────────────────────────────────── -->
<div class="ambient" aria-hidden="true">
  <div class="ambient__grid"></div>
  <div class="ambient__glow ambient__glow--maroon"></div>
  <div class="ambient__glow ambient__glow--top"></div>
  <div class="ambient__glow ambient__glow--deep"></div>
  <div class="ambient__glow ambient__glow--ember"></div>
  <div class="ambient__horizon"></div>
  <div class="ambient__spot"></div>
  <div class="ambient__grain"></div>
  <div class="ambient__vignette"></div>
  <canvas class="storm" data-storm aria-hidden="true"></canvas>
</div>

<div class="frame" aria-hidden="true">
  <span class="frame__corner frame__corner--tl"></span>
  <span class="frame__corner frame__corner--tr"></span>
  <span class="frame__corner frame__corner--bl"></span>
  <span class="frame__corner frame__corner--br"></span>
</div>

<div class="site">
  <!-- ── Quiet identity marks (no navigation) ────────────────── -->
  <div class="marks" aria-hidden="true"></div>

  <!-- ── Hero ────────────────────────────────────────────────── -->
  <main class="hero" id="main" tabindex="-1">
    <div class="stage">

      <div class="intro">
        <p class="eyebrow reveal" data-reveal style="--delay: .05s">
          <span class="eyebrow__line"></span>
          Portfolio <span class="eyebrow__year">2026</span>
        </p>

        <h1 class="identity reveal" data-reveal style="--delay: .12s">
          <span class="identity__name">JOHNCEL VIC C. DITCHON</span>
          <span class="identity__role">Full Stack Developer</span>
        </h1>
      </div>

      <!-- ── Portrait scene ───────────────────────────────────── -->
      <section class="showcase" aria-label="Portrait" data-showcase>
        <div class="scene" data-scene>

          <div class="scene__halo" aria-hidden="true"></div>
          <div class="scene__column" aria-hidden="true"></div>
          <div class="scene__ring" aria-hidden="true"></div>
          <div class="scene__ring scene__ring--dashed" aria-hidden="true"></div>
          <div class="scene__arc" aria-hidden="true"></div>

          <div class="portrait">
            <div class="portrait__enter">
              <div class="portrait__float">
                <div class="portrait__glow" aria-hidden="true"></div>
                <figure class="portrait__media">
                  <img class="portrait__ghost" src="assets/portrait-cutout.webp" alt="" aria-hidden="true" draggable="false">
                  <picture>
                    <source srcset="assets/portrait-cutout.webp" type="image/webp">
                    <img src="assets/portrait-cutout.webp" width="924" height="1488"
                         alt="Portrait of Johncel Vic C. Ditchon, full stack developer, wearing a navy suit with arms crossed."
                         fetchpriority="high" decoding="async" draggable="false">
                  </picture>
                </figure>
              </div>
            </div>
          </div>

          <div class="fx fx--orb fx--orb-a" style="--depth: 44" aria-hidden="true">
            <span class="orb"></span>
          </div>
          <div class="fx fx--orb fx--orb-b" style="--depth: 30" aria-hidden="true">
            <span class="orb orb--sm"></span>
          </div>

          <div class="fx fx--cube" style="--depth: 58" aria-hidden="true">
            <div class="cube">
              <span class="cube__face cube__face--front"></span>
              <span class="cube__face cube__face--back"></span>
              <span class="cube__face cube__face--right"></span>
              <span class="cube__face cube__face--left"></span>
              <span class="cube__face cube__face--top"></span>
              <span class="cube__face cube__face--bottom"></span>
            </div>
          </div>

          <div class="fx fx--bead" style="--depth: 36" aria-hidden="true"><span class="bead"></span></div>
          <div class="fx fx--spark fx--spark-a" style="--depth: 52" aria-hidden="true"><span class="spark"></span></div>
          <div class="fx fx--spark fx--spark-b" style="--depth: 20" aria-hidden="true"><span class="spark"></span></div>

          <p class="scene__edge-label" aria-hidden="true">Johncel&nbsp;Vic&nbsp;C.&nbsp;Ditchon</p>
        </div>

        <div class="aura-layer" data-aura-layer aria-hidden="true">
          <canvas class="aura" data-aura></canvas>
        </div>
      </section>

      <div class="pitch">
        <div class="actions reveal" data-reveal style="--delay: .4s">
          <!-- Replace the mailto address and profile URL below with your real contact details. -->
          <a class="btn btn--primary" href="mailto:your.email@example.com?subject=Project%20inquiry%20%E2%80%94%20Johncel">
            <span>Contact me</span>
            <svg class="btn__icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M4 12 12 4M12 4H5.5M12 4v6.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </a>
          <a class="btn btn--ghost" href="https://www.linkedin.com/in/your-profile" target="_blank" rel="noopener noreferrer">
            <span>View profile</span>
            <svg class="btn__icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M4 12 12 4M12 4H5.5M12 4v6.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </a>
        </div>
      </div>

    </div>
  </main>

  <footer class="foot">
    <p>© 2026 Johncel Vic C. Ditchon</p>
  </footer>
</div>

<script src="assets/main.js" defer></script>
<script src="assets/aura.js" defer></script>
<script src="assets/storm.js" defer></script>
